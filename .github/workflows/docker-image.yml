name: Docker Image Build and Run

on:
  push:
    branches: [ main, dev*, experimental, test* ]
  pull_request:
    branches: [ main, dev*, experimental, test* ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      run: |
        ls -alth
        ./generate.sh

    - name: Info on Docker images
      run: |
        docker -v
        docker images



