<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worm3DViewer fast view</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #status { position: absolute; left: 8px; top: 6px; font: 12px/1.3 sans-serif; color: #444;
            background: rgba(255, 255, 255, 0.7); padding: 2px 6px; border-radius: 4px; }
  #status:empty { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status"></div>
<script src="fastview.js"></script>
</body>
</html>
